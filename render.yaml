# Render Blueprint: https://render.com/docs/blueprint-spec
# Luo web-palvelun ja PostgreSQL-tietokannan. Migraatiot ajetaan jokaisen
# deployn yhteydessä ennen kuin uusi versio otetaan käyttöön (preDeployCommand).

databases:
  - name: autoerp-db
    databaseName: autoerp
    user: autoerp
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []  # vain Renderin sisäverkosta

services:
  - type: web
    name: autoerp
    runtime: python
    plan: starter  # preDeployCommand vaatii maksullisen instanssin
    region: frankfurt
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /terveys/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: autoerp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Oma verkkotunnus pilkulla erotettuna, jos sellainen on (Renderin oma osoite lisätään automaattisesti)
      - key: ALLOWED_HOSTS
        sync: false
      # Cloudflare R2 (kuvat). Arvot asetetaan Renderin hallintapaneelissa.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
